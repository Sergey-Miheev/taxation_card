name: taxation_card
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  bloc: ^9.0.0
  cupertino_icons: ^1.0.8
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  go_router: ^16.0.0
  path: ^1.9.0
  sqflite: ^2.4.1
  talker_bloc_logger: ^5.1.16

dev_dependencies:
  build_runner: ^2.7.1
  carapacik_lints: ^1.13.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  freezed: ^3.2.3

flutter:
  uses-material-design: true
  assets:
    - lib/core/assets/app/splash.jpg

flutter_native_splash:
  color: "#FFFFFF"
  image: lib/core/assets/app/splash.jpg
  android: true
  ios: true
  web: false
  android_12:
    color: "#FFFFFF"
    image: lib/core/assets/app/splash.jpg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: lib/core/assets/icons/ic_logo.jpg
  min_sdk_android: 21
